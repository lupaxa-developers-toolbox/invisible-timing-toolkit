[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-invisible-timing-toolkit"
dynamic = ["version"]
description = "Opt-in runtime timing hooks for functions, loops, files, HTTP, SQLite, subprocess, and imports."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.10"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["timing", "profiling", "performance", "hooks"]

dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/lupaxa-developers-toolbox/invisible-timing-toolkit"
Documentation = "https://github.com/lupaxa-developers-toolbox/invisible-timing-toolkit"
Repository = "https://github.com/lupaxa-developers-toolbox/invisible-timing-toolkit"
Issues = "https://github.com/lupaxa-developers-toolbox/invisible-timing-toolkit/issues"

[project.optional-dependencies]
http = [
  "requests>=2.28",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "hatch>=1.12.0",
  "bump-my-version>=1.2.0",
  "requests>=2.28",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "requests>=2.28",
]

[tool.hatch.version]
path = "src/lupaxa/invisible_timing_toolkit/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "README.md",
  "LICENCE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "S",
  "UP",
  "SIM",
  "C4",
  "ISC",
  "D",
  "ANN",
  "PT",
]

ignore = [
  "ANN401",
  "D200",
  "D201",
  "D202",
  "D203",
  "D204",
  "D205",
  "D206",
  "D207",
  "D208",
  "D209",
  "D210",
  "D211",
  "D212",
  "S404",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
  "S603",
  "S607",
  "ANN001",
  "ANN201",
  "D103",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
